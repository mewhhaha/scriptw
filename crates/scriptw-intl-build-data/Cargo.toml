[package]
name = "scriptw-intl-build-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The sole trust constructor is explicitly unsafe. Consumer/admission code in
# scriptw-intl continues inheriting the workspace's unsafe-code prohibition.
[lib]
path = "src/lib.rs"

# Contains audited unsafe code, so it cannot inherit the workspace
# `unsafe_code = "forbid"`; it keeps the workspace `unused_must_use` denial.
[lints.rust]
unused_must_use = "deny"
