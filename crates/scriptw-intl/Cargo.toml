[package]
name = "scriptw-intl"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
scriptw-intl-build-data = { path = "../scriptw-intl-build-data" }
writeable = { version = "=0.6.3", default-features = false }
icu_calendar = { version = "=2.0.6", default-features = false, features = ["serde", "alloc"] }
icu_collator = { version = "=2.0.0", default-features = false, features = ["serde"] }
icu_list = { version = "=2.0.1", default-features = false, features = ["serde", "datagen"] }
icu_locale = { version = "=2.0.0", default-features = false, features = ["serde"] }
icu_provider = { version = "=2.0.0", default-features = false, features = ["sync", "deserialize_postcard_1", "export"] }
icu_provider_blob = { version = "=2.0.0", default-features = false, features = ["alloc", "export"] }
icu_provider_adapters = { version = "=2.0.0", default-features = false }
icu_normalizer = { version = "=2.0.1", default-features = false, features = ["serde"] }
icu_segmenter = { version = "=2.0.1", default-features = false, features = ["serde", "auto"] }

# Exact, locked data/selector inputs; no OS zone database is consulted.
timezone_provider = { version = "=0.1.2", default-features = false, features = ["tzif"] }
tzif = "=0.4.1"
sha2 = { version = "=0.10.9", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
ryu-js = "=1.0.2"

[build-dependencies]
icu_collections = { version = "=2.0.0", default-features = false }
icu_calendar = { version = "=2.0.6", default-features = false, features = ["datagen", "compiled_data"] }
icu_calendar_data = { version = "=2.0.0", default-features = false }
jiff-tzdb = "=0.1.6"
serde_json = "=1.0.149"
icu_segmenter = { version = "=2.0.1", default-features = false, features = ["datagen", "auto"] }
icu_segmenter_data = { version = "=2.0.0", default-features = false }
zerovec = { version = "=0.11.6", default-features = false, features = ["alloc"] }
scriptw-intl-collator-data = { path = "../scriptw-intl-collator-data" }
icu_collator = { version = "=2.0.0", default-features = false, features = ["datagen"] }
icu_normalizer = { version = "=2.0.1", default-features = false, features = ["datagen"] }
icu_locale = { version = "=2.0.0", default-features = false, features = ["compiled_data", "datagen"] }
icu_list = { version = "=2.0.1", default-features = false, features = ["datagen"] }
icu_list_data = { version = "=2.0.0", default-features = false }
icu_provider = { version = "=2.0.0", default-features = false, features = ["export", "sync"] }
icu_provider_blob = { version = "=2.0.0", default-features = false, features = ["export"] }

[dev-dependencies]
zerovec = { version = "=0.11.6", default-features = false, features = ["alloc"] }
icu_list = { version = "=2.0.1", default-features = false, features = ["compiled_data"] }
icu_locale = { version = "=2.0.0", default-features = false, features = ["compiled_data"] }
icu_calendar = { version = "=2.0.6", default-features = false, features = ["compiled_data"] }
jiff-tzdb = "=0.1.6"
calendrical_calculations = { version = "=0.2.4", default-features = false }
tinystr = { version = "=0.8.3", default-features = false }

[lints]
workspace = true

[lib]
path = "src/lib.rs"
