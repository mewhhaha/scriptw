[package]
name = "scriptw-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[dependencies]
scriptw-engine = { path = "../scriptw-engine" }
scriptw-test262 = { path = "../scriptw-test262" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
# The embedder-owned Engine that `scriptw precompile` configures; the engine
# crate already enables these and further features.
wasmtime = { package = "wtime-aot-host", git = "https://github.com/mewhhaha/wtime.git", branch = "feat/aarch64-store-ci" }
# Optional global allocator of local dist and benchmark compiler binaries
# (scripts/build-dist.sh); see the `jemalloc` feature.
tikv-jemallocator = { version = "=0.7.0", optional = true }

[features]
# Benchmark examples only; absent from default product builds.
benchmark-module-images = ["scriptw-engine/benchmark-module-images"]
# Off by default: product/release builds of `scriptw` must link no JavaScript
# interpreter/VM engine (AGENTS.md). Enable only for developer-only
# differential-oracle testing (`differential replay --oracle spec-exec` or an
# explicit `--execution-backend spec-exec`); see conformance areas T25 and T27. A plain
# `cargo build -p scriptw-cli` must never pull in boa_engine.
spec-exec-oracle = [
  "scriptw-engine/spec-exec-oracle",
  "scriptw-test262/spec-exec-oracle",
]
# Off by default: verification-only hooks of profile-guided compilation, the
# Test262 SCRIPTW_TEST262_EXECUTION_PROFILE hook, rsc_baseline's
# SCRIPTW_RSC_PROFILE_ADVERSARIAL and `scriptw precompile --profile`. Never
# enable it for a shipped/product build or a published Test262 run.
# Off by default: rsc_baseline's SCRIPTW_RSC_PORTABLE_BUNDLE diagnostic, which
# runs a P/R pair rewritten outside the compiler (an external Wasm optimiser)
# to measure emitter headroom. Never enable it for a shipped/product build.
module-replacement = []
profile-experiments = [
  "scriptw-engine/profile-experiments",
  "scriptw-test262/profile-experiments",
]

# Off by default: jemalloc as the global allocator of `scriptw`, of the
# integration tests that call `run_cli_capture` and of the examples that name
# `scriptw_cli` (rsc_baseline, compiler_precompiled_baseline; see src/lib.rs).
# scripts/build-dist.sh enables it for local dist and benchmark binaries. In
# three A/B campaigns it took 1-10% less compiler user CPU and about 50 MiB less
# peak RSS on the RSC compile than glibc malloc, with identical artifacts on
# the compared inputs (docs/rust-rewrite/benchmarks.md). Binaries that link it
# must carry jemalloc's BSD-2-Clause notice (THIRD-PARTY-NOTICES.md). Its C
# build adds about a minute to a cold build, so development and test builds
# keep glibc.
jemalloc = ["dep:tikv-jemallocator"]

[[bin]]
name = "scriptw"
path = "src/bin/scriptw.rs"

[lib]
path = "src/lib.rs"

[[example]]
name = "compiler_precompiled_baseline"
test = true

[dev-dependencies]
wasmtime-wasi = { version = "=47.0.0", default-features = false, features = ["p1"] }

# Contains audited unsafe code, so it cannot inherit the workspace
# `unsafe_code = "forbid"`; it keeps the workspace `unused_must_use` denial.
[lints.rust]
unused_must_use = "deny"
