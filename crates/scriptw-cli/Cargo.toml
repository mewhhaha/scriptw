[package]
name = "scriptw-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[dependencies]
scriptw-engine = { path = "../scriptw-engine" }
scriptw-test262 = { path = "../scriptw-test262" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"

[features]
# Off by default: product/release builds of `scriptw` must link no JavaScript
# interpreter/VM engine (AGENTS.md). Enable only for developer-only
# differential-oracle testing (`differential replay --oracle spec-exec` or an
# explicit `--execution-backend spec-exec`); see conformance areas T25 and T27. A plain
# `cargo build -p scriptw-cli` must never pull in boa_engine.
spec-exec-oracle = [
  "scriptw-engine/spec-exec-oracle",
  "scriptw-test262/spec-exec-oracle",
]

[[bin]]
name = "scriptw"
path = "src/bin/scriptw.rs"

[lib]
path = "src/lib.rs"

[dev-dependencies]
wasmtime = { version = "=47.0.0", default-features = false, features = ["cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=47.0.0", default-features = false, features = ["p1"] }
