[package]
autotests = false
name = "scriptw-ir"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
boa_ast = { version = "0.21.1", features = ["annex-b"] }
boa_interner = "0.21.1"
icu_properties = "2.0.2"
num-bigint = "0.4.6"
num-traits = "0.2.19"
scriptw-front = { path = "../scriptw-front" }
regress = "0.10.5"
ryu-js = "=1.0.2"
serde_json = "1.0"

[dev-dependencies]
boa_parser = { version = "0.21.1", features = ["annex-b"] }

[lib]
path = "src/lib.rs"

[[test]]
name = "scriptw_ir_integration"
path = "tests/integration.rs"

# Its own process: a test reads the peak resident set of the whole process.
[[test]]
name = "compile_memory"
path = "tests/compile_memory.rs"

[lints]
workspace = true
