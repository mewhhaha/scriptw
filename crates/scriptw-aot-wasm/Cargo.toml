[package]
name = "scriptw-aot-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
icu_calendar = { version = "2.0.6", default-features = false, features = ["compiled_data"] }
icu_normalizer = { version = "2.0.1", default-features = false, features = ["compiled_data"] }
icu_properties = "2.0.2"
memchr = { version = "2.8.0", default-features = false, features = ["std"] }
scriptw-ir = { path = "../scriptw-ir" }
scriptw-intl = { path = "../scriptw-intl" }
scriptw-runtime = { path = "../scriptw-runtime" }
scriptw-front = { path = "../scriptw-front" }
sha2 = "0.10.9"
# Exact: `wasm_encoder::Instruction` is non-exhaustive, and the code sink's
# i32 fact flow and GC-local write check (src/code_sink.rs,
# src/code_sink/gc_local_writes.rs) list every control-transfer operator of
# this version by hand. Any upgrade, even a compatible patch release, must
# re-list them, since an unlisted operator is treated as straight-line code.
wasm-encoder = { version = "=0.245.1", features = ["wasmparser"] }
wasmparser = "0.245.1"

[dev-dependencies]
wasmtime-environ = { version = "=47.0.0", default-features = false, features = ["gc-copying", "std"] }

[build-dependencies]
icu_calendar = { version = "2.0.6", default-features = false, features = ["compiled_data"] }
icu_normalizer = { version = "2.0.1", default-features = false, features = ["compiled_data"] }

[lib]
path = "src/lib.rs"

# Contains audited unsafe code, so it cannot inherit the workspace
# `unsafe_code = "forbid"`; it keeps the workspace `unused_must_use` denial.
[lints.rust]
unused_must_use = "deny"
