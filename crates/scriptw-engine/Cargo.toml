[package]
name = "scriptw-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
scriptw-runtime-image = { path = "../scriptw-runtime-image" }
scriptw-aot-wasm = { path = "../scriptw-aot-wasm" }
scriptw-front = { path = "../scriptw-front" }
scriptw-ir = { path = "../scriptw-ir" }
scriptw-intl = { path = "../scriptw-intl" }
scriptw-runtime = { path = "../scriptw-runtime" }
scriptw-spec-exec = { path = "../scriptw-spec-exec", optional = true }
rayon = "1.11.0"
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
sha2 = "0.10.9"
wasmparser = "0.245.1"
wasmtime = { package = "wtime-aot-host", git = "https://github.com/mewhhaha/wtime.git", branch = "feat/aarch64-store-ci" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "mm", "param"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "time"] }

# The pooled-store tests page memory out and read /proc/self/pagemap.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1.4", features = ["fs", "mm", "param", "time"] }

[build-dependencies]
sha2 = "0.10.9"

[features]
# Portable embedders may omit runtime source compilation and its callback roots.
# This does not remove the static Rust compiler APIs or Cranelift dependency.
default = ["native-source-compiler"]
native-source-compiler = []
# Off by default; address-only hooks for excluded precompiled phase diagnostics.
benchmark-module-images = []
# Off by default: verification-only hooks of profile-guided compilation
# (wrong-profile builders). Never enable it for a shipped/product build.
profile-experiments = []
# Off by default: keeps the Boa interpreter (scriptw-spec-exec / boa_engine)
# out of product and release builds. Only enable for developer-only
# differential-oracle testing (see AGENTS.md and conformance area T25). Never enable this
# feature for a shipped/product build.
spec-exec-oracle = ["dep:scriptw-spec-exec", "scriptw-spec-exec/oracle"]

[lib]
path = "src/lib.rs"

# Contains audited unsafe code, so it cannot inherit the workspace
# `unsafe_code = "forbid"`; it keeps the workspace `unused_must_use` denial.
[lints.rust]
unused_must_use = "deny"
