[package]
name = "scriptw-precompiled-consumer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "../scriptw-cli/build.rs"

[dependencies]
scriptw-engine = { path = "../scriptw-engine", default-features = false }
serde_json = "1.0"
sha2 = "0.10.9"
wasmtime = { package = "wtime-aot-host", git = "https://github.com/mewhhaha/wtime.git", branch = "feat/aarch64-store-ci" }

[features]
# Enables the same excluded mapping diagnostic as the producer host.
benchmark-module-images = ["scriptw-engine/benchmark-module-images"]
# Control build for same-source capability-on/off experiments.
native-source-compiler = ["scriptw-engine/native-source-compiler"]

# Compiles the scriptw-cli example sources it shares through #[path], which
# contain audited unsafe code, so it cannot inherit the workspace
# `unsafe_code = "forbid"`; it keeps the workspace `unused_must_use` denial.
[lints.rust]
unused_must_use = "deny"
