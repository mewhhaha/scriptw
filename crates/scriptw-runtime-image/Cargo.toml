[package]
name = "scriptw-runtime-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
sha2 = "0.10.9"

[build-dependencies]
cc = "1.2.59"
sha2 = "0.10.9"
scriptw-aot-wasm = { path = "../scriptw-aot-wasm" }
scriptw-intl = { path = "../scriptw-intl" }
scriptw-ir = { path = "../scriptw-ir" }
wasmtime = { package = "wtime-aot-host", git = "https://github.com/mewhhaha/wtime.git", branch = "feat/aarch64-store-ci" }

# Contains audited unsafe code, so it cannot inherit the workspace
# `unsafe_code = "forbid"`; it keeps the workspace `unused_must_use` denial.
[lints.rust]
unused_must_use = "deny"
