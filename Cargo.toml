[workspace]
members = [
  "crates/scriptw-verification-feature-roots",
  "crates/scriptw-front",
  "crates/scriptw-ir",
  "crates/scriptw-intl",
  "crates/scriptw-intl-build-data",
  "crates/scriptw-intl-collator-data",
  "crates/scriptw-runtime",
  "crates/scriptw-runtime-image",
  "crates/scriptw-spec-exec",
  "crates/scriptw-aot-wasm",
  "crates/scriptw-engine",
  "crates/scriptw-cli",
  "crates/scriptw-test262",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.94.0"
license = "MIT"
version = "0.1.0"
authors = ["Scriptw contributors"]
repository = "https://github.com/mewhhaha/scriptw"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
boa_ast = { path = "vendor/boa_ast-0.21.1" }
boa_engine = { path = "vendor/boa_engine-0.21.1" }
boa_parser = { path = "vendor/boa_parser-0.21.1" }
icu_calendar = { path = "vendor/icu_calendar-2.0.6" }
regress = { path = "vendor/regress-0.10.5" }
temporal_rs = { path = "vendor/temporal_rs-0.1.0" }
timezone_provider = { path = "vendor/timezone_provider-0.1.2" }
wasmtime = { path = "vendor/wasmtime-47.0.0" }
wasmtime-internal-cache = { path = "vendor/wasmtime-internal-cache-47.0.0" }

# Developer builds keep Scriptw's large IR/backend crates cheap to rebuild,
# while compiling third-party code (notably Wasmtime/Cranelift) once at a
# useful optimization level. `line-tables-only` preserves source locations
# without the much larger full debuginfo footprint.
[profile.dev]
debug = "line-tables-only"
incremental = true

# Release is what drives multi-hour Test262 sweeps. Line tables cost binary size
# only and make a panic in hour six diagnosable.
#
# Deliberately no `lto` and no `codegen-units = 1`. Workspace code is roughly 7%
# of a cold compile (measured: 0.84 s lowering against 11.73 s native Cranelift
# compilation), so both settings optimize the small end while taxing every
# rebuild-after-compiler-edit — which is the loop this project actually runs.
[profile.release]
debug = "line-tables-only"

# Keep symbols/panic locations; omit DWARF from the shipped CLI and examples.
# Full executable identity hashing still covers every byte of those artifacts.
[profile.release.package.scriptw-cli]
strip = "debuginfo"

# The runtime-image producer emits/adopts R in Rust before native compilation.
# Its separate host graph previously defaulted to opt0 even in release builds.
# Same-source opt1 preserves exact package/native/manifest bytes and cuts warm
# producer work from38–39s to2.9–3.9s; see the source-bound host checkpoint.
[profile.release.build-override]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.test]
debug = "line-tables-only"
incremental = true

[profile.test.package."*"]
opt-level = 2

# Build the third-party native compiler with its normal release checks/profile
# once, then reuse it while editing Scriptw. Wasm input validation and Scriptw's own
# debug assertions remain active. Cranelift's compiled-in SSA/debug traversals
# otherwise run inside every cold native compilation, even with its separate
# configurable verifier disabled. Keep dev and test dependency graphs equal.
[profile.dev.package.wasmtime]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.test.package.wasmtime]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.test.package.wasmtime-internal-cranelift]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.cranelift-codegen]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.test.package.cranelift-codegen]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.cranelift-frontend]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.test.package.cranelift-frontend]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.regalloc2]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.test.package.regalloc2]
opt-level = 3
debug-assertions = false
overflow-checks = false

# Boa uses this small crate through both its normal and proc-macro graphs.
# Keep its debug info identical in both contexts so selecting a different
# test target does not invalidate Boa, the frontend and the IR libraries.
[profile.test.package.cow-utils]
debug = 0

# This data crate is reached through both normal and build dependency graphs.
# Selecting focused test roots must preserve the host graph's debug profile.
[profile.test.package.scriptw-intl-collator-data]
debug = 0

# Package overrides win over the wildcard dependency setting above. IR
# analysis, Intl admission and the Wasm emitter run at opt-level 2 because
# their cold per-case work dominates fixed execution budgets and large suites.
# Keep the frontend and embedding layers unoptimized for cheap local edits;
# release-like dependency optimization preserves all ordinary admission checks.
[profile.dev.package.scriptw-front]
opt-level = 0
[profile.dev.package.scriptw-ir]
opt-level = 2
[profile.dev.package.scriptw-intl]
opt-level = 2
[profile.dev.package.scriptw-runtime]
opt-level = 0
[profile.dev.package.scriptw-runtime-image]
opt-level = 0
[profile.dev.package.scriptw-spec-exec]
opt-level = 0
[profile.dev.package.scriptw-aot-wasm]
opt-level = 2
[profile.dev.package.scriptw-engine]
opt-level = 0
[profile.dev.package.scriptw-cli]
opt-level = 0
strip = "debuginfo"
[profile.dev.package.scriptw-test262]
opt-level = 0
strip = "debuginfo"

[profile.test.package.scriptw-front]
opt-level = 0
[profile.test.package.scriptw-ir]
opt-level = 2
[profile.test.package.scriptw-intl]
opt-level = 2
[profile.test.package.scriptw-runtime]
opt-level = 0
[profile.test.package.scriptw-runtime-image]
opt-level = 0
[profile.test.package.scriptw-spec-exec]
opt-level = 0
[profile.test.package.scriptw-aot-wasm]
opt-level = 2
[profile.test.package.scriptw-engine]
opt-level = 0
[profile.test.package.scriptw-cli]
opt-level = 0
strip = "debuginfo"
[profile.test.package.scriptw-test262]
opt-level = 0
strip = "debuginfo"
