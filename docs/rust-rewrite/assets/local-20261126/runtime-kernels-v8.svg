<text x="28" y="34" font-size="18" font-weight="650" fill="#24292f">Runtime kernels — Scriptw speedup over Node 24 / V8 (80w)</text>
<text x="28" y="54" font-size="12" fill="#57606a">Higher is faster (log scale, V8 ÷ Scriptw) · 15/17 faster · 6.36× geomean (vs V8 5w: 16/17 · 3.89×)</text>
