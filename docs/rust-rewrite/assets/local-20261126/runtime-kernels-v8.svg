<svg xmlns="http://www.w3.org/2000/svg" width="760" height="602" viewBox="0 0 760 602" role="img" aria-labelledby="title desc">
<title id="title">Runtime kernels: Scriptw vs Node 24 / V8</title>
<desc id="desc">17 runtime kernels comparing Scriptw ABI 92 to 80-warmup V8: 15/17 faster, 6.36x geometric mean speedup.</desc>
<rect x="0.5" y="0.5" width="759" height="601" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
