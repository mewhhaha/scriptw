<svg xmlns="http://www.w3.org/2000/svg" width="760" height="602" viewBox="0 0 760 602" role="img" aria-labelledby="title desc">
<title id="title">Runtime kernels: Scriptw ABI 96 vs Node 24 / V8</title>
<desc id="desc">17 runtime kernels comparing Scriptw ABI 96 to 80-warmup V8: 17/17 faster, 5.24x geomean.</desc>
