<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">Edge workloads: Scriptw vs V8</title>
<desc id="desc">Six edge workloads in a precompiled fresh Realm vs 80-warmup V8: Scriptw wins 6/6 with a 1.34x geometric mean speedup.</desc>
